name: Publish to VS Code Marketplace

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-${{ github.event.release.tag_name || 'verify-identity' }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Validate release version and channel
        id: release
        run: node scripts/release.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Package the selected channel
        env:
          PRE_RELEASE: ${{ steps.release.outputs.pre_release }}
        run: |
          args=()
          if [ "$PRE_RELEASE" = "true" ]; then args+=(--pre-release); fi
          pnpm package "${args[@]}"
      - run: pnpm prepare-fixture
      - run: xvfb-run -a pnpm integration-test --packaged --independent
      - name: Preserve tested packages
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-${{ steps.release.outputs.version }}
          path: |
            artifacts/*.vsix
            artifacts/*.tgz
          if-no-files-found: error
          overwrite: true
      - name: Check identity configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ]; then
            echo "::error::Set AZURE_CLIENT_ID and AZURE_TENANT_ID in the marketplace environment. See docs/releases.md."
            exit 1
          fi
      - name: Sign in with the GitHub federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish tested VSIX
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          VSIX_PATH: ${{ steps.release.outputs.vsix }}
          PRE_RELEASE: ${{ steps.release.outputs.pre_release }}
        run: |
          args=(--azure-credential --packagePath "$VSIX_PATH")
          if [ "$PRE_RELEASE" = "true" ]; then args+=(--pre-release); fi
          pnpm exec vsce publish "${args[@]}"

  verify-identity:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check identity configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ]; then
            echo "::error::Set AZURE_CLIENT_ID and AZURE_TENANT_ID in the marketplace environment. See docs/releases.md."
            exit 1
          fi
      - name: Sign in with the GitHub federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Show Marketplace identity ID
        run: |
          identity_id=$(az rest --method get --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id --output tsv)
          if [ -z "$identity_id" ]; then
            echo "::error::Azure DevOps returned no Marketplace identity ID. See docs/releases.md."
            exit 1
          fi
          printf 'Marketplace identity ID: %s\n' "$identity_id" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify publisher access without uploading
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: pnpm exec vsce verify-pat JDeffner --azure-credential
